name: CI - user-service

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.5'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: 'v2.3.1'

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.5'

      - name: Build app
        run: |
          go mod tidy
          go build -o user-service ./cmd/main.go

  test:
    name: Run Tests & SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.5'

      - name: Run tests and generate coverage
        run: |
          go mod tidy
          go test ./... -coverprofile=coverage.out
          go tool cover -func=coverage.out
          echo "coverage=$(go tool cover -func=coverage.out | grep total | awk '{print substr($3, 1, length($3)-1)}')" >> $GITHUB_ENV

      - name: SonarCloud analysis
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          projectBaseDir: .
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: guttosm_user-service
          SONAR_ORGANIZATION: guttosm-personal-projects

  migrate:
    name: Run DB Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: userdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.5'

      - name: Install goose
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@latest

      - name: Run goose migrations
        env:
          GOOSE_DRIVER: postgres
          GOOSE_DBSTRING: postgres://postgres:postgres@localhost:5432/userdb?sslmode=disable
        run: |
          $HOME/go/bin/goose -dir db/migrations up

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [test, migrate]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: vars
        run: |
          IMAGE=ghcr.io/${{ github.repository }}
          SHA_TAG=sha-${GITHUB_SHA::7}

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION_TAG=${GITHUB_REF##*/}
          else
            VERSION_TAG=dev
          fi

          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
          echo "SHA_TAG=$SHA_TAG" >> $GITHUB_ENV
          echo "VERSION_TAG=$VERSION_TAG" >> $GITHUB_ENV

      - name: Build and push image
        run: |
          docker build -t $IMAGE:$SHA_TAG -t $IMAGE:$VERSION_TAG .
          docker push $IMAGE:$SHA_TAG
          docker push $IMAGE:$VERSION_TAG
