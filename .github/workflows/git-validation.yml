# .github/workflows/git-validation.yml
name: Git Conventions Validation

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate commit messages
        uses: wagoid/commitlint-github-action@v5

      - name: Validate branch name
        run: |
          BRANCH_NAME="${GITHUB_HEAD_REF:-${GITHUB_REF##*/}}"
          echo "Validating branch name: $BRANCH_NAME"

          if [[ ! "$BRANCH_NAME" =~ ^(main|develop|(feature|fix|hotfix|chore|refactor|docs|test)\/[A-Z]+-[0-9]+-[a-z0-9-]+)$ ]]; then
            echo "Branch name '$BRANCH_NAME' is invalid."
            echo "Allowed: main, develop, or <type>/<JIRA-ID>-<description>"
            echo "Example: feature/DEV-1234-onboarding"
            exit 1
          fi

          echo " Branch name valid."
